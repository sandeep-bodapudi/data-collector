<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · OneBridge Data Collector</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #101828; --muted: #667085; --line: #eaecf0; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c111d; --card: #161b26; --text: #f5f5f6; --muted: #94969c; --line: #262c3a; --accent: #4b83f5; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
    font: 15px/1.55 Inter, "Segoe UI", system-ui, sans-serif; }
  .card { max-width: 440px; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 36px 28px; }
  .logo { width: 84px; height: 68px; background: #fff; border-radius: 12px; padding: 8px; margin: 0 auto 18px; display: block; }
  h1 { margin: 0 0 8px; font-size: 21px; }
  p { margin: 0 0 20px; color: var(--muted); }
  button { border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 9px; cursor: pointer; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/static/logo.svg" alt="OneBridge">
    <h1>You're offline</h1>
    <p>The Data Collector needs a connection to start. Your saved sheets stay safe on this device and will be here when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
